name: Build MoWang Repo

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'packages/**'
      - 'catalog-state/**'
      - 'scripts/catalog-build.py'
      - 'scripts/import-catalog.py'
      - 'build.sh'
      - 'check-debs.sh'
      - 'validate-repo.sh'
      - '.github/workflows/build.yml'
      - 'scripts/publish-indexes.sh'
      - 'scripts/test-publish-indexes.py'
      - 'scripts/test-index-filenames.py'
  workflow_dispatch:

# Finish validation for the running snapshot; obsolete snapshots never write back.
concurrency:
  group: repository-indexes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record build base
        run: echo "INDEX_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Test index filename parsing
        run: python3 scripts/test-index-filenames.py

      - name: Test index publication guards
        run: python3 scripts/test-publish-indexes.py

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 xz-utils zstd

      - name: Build repository indexes
        run: bash ./build.sh

      - name: Validate repository
        run: bash ./validate-repo.sh

      - name: Commit generated indexes
        env:
          INDEX_BUILD_REF: ${{ github.ref }}
        run: bash scripts/publish-indexes.sh

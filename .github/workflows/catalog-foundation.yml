name: Catalog foundation read-only verification

on:
  push:
    branches: [feat/catalog-inbox-phase1]
    paths: ['packages/**', 'catalog-state/**', 'scripts/catalog*', 'scripts/bootstrap-catalog.py', 'scripts/test-catalog.py', '.github/workflows/catalog-foundation.yml']
  pull_request:
    paths: ['packages/**', 'catalog-state/**', 'scripts/catalog*', 'scripts/bootstrap-catalog.py', 'scripts/test-catalog.py', '.github/workflows/catalog-foundation.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: catalog-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Only metadata and Git trees are needed. Do not checkout 3.45GB debs.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/debs/
      - name: Offline catalog and transaction safety tests (no credentials)
        run: python3 scripts/test-catalog.py
      - name: Validate all committed records and source ledger
        run: python3 scripts/catalog.py validate
      - name: Every R2 object full GET SHA256 plus original Git blob SHA1
        run: |
          python3 scripts/bootstrap-catalog.py --output "$RUNNER_TEMP/catalog-full-verified"
          diff -r --exclude=README.md packages "$RUNNER_TEMP/catalog-full-verified/packages"
          cmp catalog-state/processed.json "$RUNNER_TEMP/catalog-full-verified/catalog-state/processed.json"
      - name: Deterministic catalog index and exact advisory cleanup plan
        run: |
          python3 scripts/catalog.py render --output "$RUNNER_TEMP/catalog.Packages"
          cmp "$RUNNER_TEMP/catalog.Packages" "$RUNNER_TEMP/catalog-full-verified/catalog.Packages"
          python3 scripts/catalog.py plan --output "$RUNNER_TEMP/cleanup-plan.json"
      - name: User navigation is generated, never source of truth
        run: |
          python3 scripts/catalog-docs.py
          git diff --exit-code -- packages/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-foundation-verification
          path: |
            ${{ runner.temp }}/catalog-full-verified/catalog-state/bootstrap-proof.json
            ${{ runner.temp }}/catalog.Packages
            ${{ runner.temp }}/cleanup-plan.json
          retention-days: 30

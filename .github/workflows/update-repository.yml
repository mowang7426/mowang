name: Publish complete R2 APT repository

on:
  push:
    branches: [main]
    paths: ['debs/**', 'packages/**', 'catalog-state/**', 'build.sh', 'check-debs.sh', 'validate-repo.sh', 'depictions/**', 'assets/**', 'scripts/**', '.github/workflows/update-repository.yml', 'CydiaIcon.png', 'index.html', 'sileo-featured.json']
  pull_request:
    paths: ['debs/**', 'packages/**', 'catalog-state/**', 'build.sh', 'check-debs.sh', 'validate-repo.sh', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      prepublish:
        description: 'Explicit trusted branch prepublication to isolated repo/ prefix'
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

# Same group for all production publishers; no cancellation in the critical section.
concurrency:
  group: r2-production-publication
  cancel-in-progress: false

jobs:
  # Explicit workflow_dispatch on the draft branch is necessary when a token
  # push does not emit workflow events. This job is read-only and gets no secrets.
  catalog_readonly:
    if: github.ref == 'refs/heads/feat/catalog-inbox-phase1'
    uses: ./.github/workflows/catalog-foundation.yml
    permissions:
      contents: read
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect all original DEBs against latest main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD:debs)" = "$(git rev-parse origin/main:debs)"
          git diff --exit-code origin/main -- debs
      - run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev bzip2 xz-utils zstd
      - run: python3 -m pip install 'boto3>=1.36,<2'
      - name: Original 28, migration 17, and production safety 26 regressions
        run: |
          python3 scripts/test-index-filenames.py
          python3 scripts/test-publish-indexes.py
          python3 scripts/test-r2-migration.py
          python3 scripts/test-r2-production.py
          python3 scripts/test-catalog.py
          python3 scripts/test-catalog-bootstrap.py
          python3 scripts/test-catalog-publication.py
          python3 scripts/test-catalog-import.py
      - name: Original full repository build and validation
        run: bash build.sh && bash validate-repo.sh
      - name: Build complete relative R2 indexes without credentials
        env:
          R2_PUBLIC_BASE_URL: https://pub-f47a5a9b45724684be0f3f006e95e609.r2.dev/repo
          REPOSITORY_NAME: mowang
          REPOSITORY_OWNER: mowang7426
        run: bash scripts/update-repository.sh
      - name: Actual APT relative Filename download
        run: bash scripts/test-r2-apt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: verified-original-packages
          path: Packages
      - uses: actions/upload-artifact@v4
        with:
          name: verified-r2-indexes
          path: _site
          include-hidden-files: true

  publish:
    needs: regression
    permissions:
      contents: write
    # PRs never receive credentials. Only main or explicit trusted branch dispatch.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/r2-deb-publish' && inputs.prepublish))
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_PREPUBLISH: ${{ inputs.prepublish && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: git fetch origin main
      - run: python3 -m pip install 'boto3>=1.36,<2'
      - run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev bzip2 xz-utils
      - name: Verify new archives, immutable R2 GETs, then non-force import CAS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export R2_PUBLIC_BASE_URL="${R2_PUBLIC_BASE_URL%/}/repo"
          if python3 scripts/catalog-build.py mode; then
            python3 scripts/import-catalog.py --branch "$GITHUB_REF_NAME"
          else
            python3 -c 'import json,subprocess; json.dump({"commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"legacy":True},open("catalog-import-result.json","w"))'
          fi
      - name: Reload successful import commit explicitly; token pushes emit no workflow
        run: |
          imported=$(python3 -c 'import json; print(json.load(open("catalog-import-result.json"))["commit"])')
          git fetch --no-tags origin "$imported"
          git checkout --detach "$imported"
          test "$(git rev-parse HEAD)" = "$imported"
      - name: Rebuild the successfully committed catalog, never pre-import artifacts
        run: |
          export R2_PUBLIC_BASE_URL="${R2_PUBLIC_BASE_URL%/}/repo"
          bash build.sh
          bash validate-repo.sh
          mkdir -p _original
          cp Packages _original/Packages
          bash scripts/update-repository.sh
      - name: Immutable DEBs and complete source; Release last; physical GC DISABLED
        run: |
          export R2_PUBLIC_BASE_URL="${R2_PUBLIC_BASE_URL%/}/repo"
          python3 scripts/publish-r2.py
      - name: Public isolated APT small large RootHide Unicode and original metadata bytes
        run: python3 scripts/verify-r2-public.py
      - name: Advisory exact inbox plan only; no deletion implementation
        run: |
          if python3 scripts/catalog-build.py mode; then
            python3 scripts/catalog.py plan --output cleanup-plan.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: r2-publication-receipt
          if-no-files-found: error
          path: |
            r2-publication-receipt.json
            r2-publication-result.json
            catalog-import-result.json
            cleanup-plan.json
